name: CI and GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "pyxel>=2.9" pytest pypinyin
      # the story, the puzzles, the content and the fonts, played without a window
      - run: pytest
      # the whole game again through the real UI: clicks, bubbles, pads, the ending
      - run: python scripts/e2e.py
      # the browser build: build/site/index.html runs on Pyxel's web runtime
      - run: python scripts/build_web.py
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Enable Pages in the repository settings (Source: GitHub Actions) before the first deploy.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
